<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Infinity X Enterprise Cloud Portal</title>
    <style>
      :root {
        --bg: #0b0e14;
        --surface: #141924;
        --border: #242b3a;
        --fg: #e6e9ef;
        --fg-muted: #8b93a7;
        --accent: #4f8cff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 420px;
        padding: 32px;
        text-align: center;
      }
      .icon {
        font-size: 32px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: var(--fg-muted);
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        border: 1px solid rgba(79, 140, 255, 0.4);
        background: rgba(79, 140, 255, 0.1);
        color: var(--accent);
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: rgba(79, 140, 255, 0.2);
      }
      #status {
        margin-top: 16px;
        font-size: 12px;
        color: var(--fg-muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>You're offline</h1>
      <p>
        The Infinity X Enterprise Cloud Portal can't reach the network right
        now. Previously visited pages may still be cached. We'll reconnect
        automatically once your connection is back.
      </p>
      <button id="retry-btn" type="button">Try Again</button>
      <div id="status">Waiting for connection…</div>
    </div>
    <script>
      var statusEl = document.getElementById("status");
      var retryBtn = document.getElementById("retry-btn");

      function attemptReload() {
        statusEl.textContent = "Checking connection…";
        fetch(window.location.href, { cache: "no-store" })
          .then(function () {
            window.location.reload();
          })
          .catch(function () {
            statusEl.textContent = "Still offline — waiting for connection…";
          });
      }

      retryBtn.addEventListener("click", attemptReload);
      window.addEventListener("online", attemptReload);
    </script>
  </body>
</html>
